<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - PataSegura</title>

<style>
:root{
    --ink:#17233c;
    --muted:#71809d;
    --line:#e3e8f2;
    --blue:#3458d4;
    --blue-dark:#2545b1;
    --blue-soft:#eef2ff;
    --bg:#f7f9fc;
    --white:#ffffff;
    --shadow:0 20px 45px rgba(30,48,91,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family: Inter, "Segoe UI", sans-serif;
    background:var(--bg);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:450px;
}

.card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:18px;
    overflow:hidden;
    box-shadow:var(--shadow);
}

.card-header{
    padding:35px;
    text-align:center;
    border-bottom:1px solid var(--line);
}

.logo{
    width:70px;
    height:70px;
    margin:auto;
    margin-bottom:15px;
    border-radius:18px;
    background:var(--blue-soft);
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
}

.card-header h1{
    color:var(--ink);
    font-size:28px;
    margin-bottom:8px;
}

.card-header p{
    color:var(--muted);
}

.card-body{
    padding:30px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    font-weight:700;
    margin-bottom:8px;
    color:var(--ink);
}

.form-group input{
    width:100%;
    height:48px;
    border:1px solid #d8dfeb;
    border-radius:10px;
    padding:0 14px;
    outline:none;
    transition:.2s;
}

.form-group input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(52,88,212,.12);
}

.btn{
    width:100%;
    border:none;
    height:50px;
    border-radius:10px;
    background:var(--blue);
    color:white;
    font-weight:700;
    cursor:pointer;
    transition:.2s;
}

.btn:hover{
    background:var(--blue-dark);
}

.links{
    margin-top:20px;
    text-align:center;
}

.links a{
    color:var(--blue);
    text-decoration:none;
    font-weight:600;
}

.links a:hover{
    text-decoration:underline;
}

.divider{
    text-align:center;
    margin:25px 0;
    color:var(--muted);
    position:relative;
}

.divider::before,
.divider::after{
    content:"";
    position:absolute;
    top:50%;
    width:35%;
    height:1px;
    background:var(--line);
}

.divider::before{
    left:0;
}

.divider::after{
    right:0;
}

.register{
    text-align:center;
    color:var(--muted);
}

.register a{
    color:var(--blue);
    text-decoration:none;
    font-weight:700;
}

.footer{
    text-align:center;
    margin-top:20px;
    color:var(--muted);
    font-size:13px;
}

@media(max-width:500px){

    .card-header{
        padding:25px;
    }

    .card-body{
        padding:20px;
    }

    .card-header h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="card-header">
            <div class="logo">🐾</div>

            <h1>PataSegura</h1>

            <p>
                Faça login para acessar o sistema
            </p>
        </div>

        <div class="card-body">

            <form>

                <div class="form-group">
                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu e-mail"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button type="submit" class="btn">
                    Entrar
                </button>

            </form>

            <div class="links">
                #
                    Esqueceu sua senha?
                </a>
            </div>

            <div class="divider">
                ou
            </div>

            <div class="register">
                Não possui conta?
                #
                    Criar cadastro
                </a>
            </div>

        </div>

    </div>

    <div class="footer">
        © 2026 PataSegura Hotel Pet
    </div>

</div>

</body>
</html>
